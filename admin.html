<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Mind Club — Admin</title>
  <link rel="icon" href="img/RMC_logo.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin">
  <h1>Admin</h1>

  <section class="card">
    <p id="stats"></p>
    <p id="status"></p>
    <button id="finish" hidden>Finish</button>
    <button id="reopen" class="secondary" hidden>Reopen</button>
  </section>

  <section id="prize" class="card" hidden>
    <h2>Prize handout</h2>
    <p id="now">Handing out the <strong id="place"></strong> · Now inviting: <strong id="winner"></strong></p>
    <p id="done" hidden>All 3 prizes have been given.</p>
    <button id="given">Prize given</button>
    <button id="skip" class="secondary">Skip</button>
    <ul id="winners"></ul>
  </section>

  <section class="card">
    <h2>Full ranking</h2>
    <table>
      <thead><tr><th>#</th><th>Nickname</th><th>G1</th><th>G2</th><th>G3</th><th>Total</th><th></th></tr></thead>
      <tbody id="players"></tbody>
    </table>
    <p id="no-players" hidden>No one has confirmed their results yet.</p>
  </section>

  <script type="module" src="js/pages/admin.js"></script>
</body>
</html>
